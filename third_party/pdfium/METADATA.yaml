# file must eventually be generated by CI from the link graph. It is not, yet.

name: pdfium
description: PDF parsing and rendering. Used by pdf-engine/reader for viewing only.
spdx_id: BSD-3-Clause
version: 156.0.8076.0
upstream_url: https://pdfium.googlesource.com/pdfium/
owner: Core lead

# --- provenance ------------------------------------------------------------
# NOT a source build. See third_party/pdfium/README.md and SP-1 §5.
acquisition: prebuilt-binary
distributor: bblanchon/pdfium-binaries
distributor_url: https://github.com/bblanchon/pdfium-binaries
release_tag: chromium/8076
released_at: "2026-09-29T13:02:32Z"
pinned_at: "2026-09-30"

artifacts:
  - platform: mac-arm64
    asset: pdfium-mac-arm64.tgz
    url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8076/pdfium-mac-arm64.tgz
    sha256: 0d6781fe08906baff3d82c90953e519fbc4eb253fe76431e5ed53b157763b97c
    archive_bytes: 3487497

patches: []          # none; the artefact is used exactly as distributed
linking: dynamic     # libpdfium.dylib — no static archive is published for macOS

# --- build configuration of the fetched artefact ---------------------------
# Verbatim from args.gn inside the archive (preserved at args.gn.mac-arm64).
gn_args:
  pdf_enable_v8: false
  pdf_enable_xfa: false
  pdf_use_partition_alloc: false
  pdf_is_standalone: true
  is_component_build: false
  is_debug: false
  # pdf_use_skia is unset => the AGG rasteriser ships, per file-format-support §7.8.

# --- binary size (process item 9) ------------------------------------------
size:
  libpdfium_dylib_bytes: 7278480     # 6.94 MiB, unstripped, arm64, as distributed
  extracted_tree_bytes: 7969177      # ~7.6 MiB including headers and licences
  note: >-
    This is a dynamic library measured as distributed. It is NOT the number
    SP-1 F-5 asks for, which is the stripped, dead-code-eliminated
    CONTRIBUTION to the shipped binary per architecture, measured with
    -ffunction-sections -fdata-sections and -dead_strip. That number cannot be
    obtained from a prebuilt dylib and is NOT IMPLEMENTED until the hermetic
    static build exists.

# --- bundled third-party code, as declared by the distributor --------------
# Copied to third_party/pdfium/licenses/. All permissive.
bundled:
  - {name: abseil,        license: Apache-2.0}
  - {name: agg23,         license: "AGG 2.3 permissive grant", review: OPEN}
  - {name: fast_float,    license: "Apache-2.0 / MIT / BSL-1.0"}
  - {name: freetype,      license: "FTL or GPL-2.0 (FTL elected)"}
  - {name: icu,           license: Unicode-3.0}
  - {name: lcms,          license: MIT}
  - {name: libjpeg_turbo, license: "IJG / BSD-3 / zlib"}
  - {name: libopenjpeg,   license: BSD-2-Clause}
  - {name: libpng,        license: libpng-2.0}
  - {name: llvm-libc,     license: Apache-2.0-with-LLVM-exception}
  - {name: simdutf,       license: "Apache-2.0 / MIT"}
  - {name: zlib,          license: Zlib}

# --- honest status against THIRD_PARTY_NOTICES section 6 -------------------
process_compliance:
  "1_licence_vendored": met            # LICENSE + licenses/ in this directory
  "2_verdict_recorded": met            # file-format-support.md §7.1 (ADOPT)
  "3_pinned_and_verified": partial     # SHA-256 verified at FETCH time by
                                       # fetch_pdfium.sh, NOT at configure time:
                                       # CMake must work offline and never
                                       # touches the network. Configure-time
                                       # verification is NOT IMPLEMENTED.
                                       # There is also no upstream COMMIT hash
                                       # — a branch head is all upstream
                                       # publishes (SP-1 F-1), so the archive
                                       # checksum is the only real pin.
  "4_notices_entry": met               # THIRD_PARTY_NOTICES section 0
  "5_static_and_ios_confirmed": NOT_IMPLEMENTED
                                       # macOS-arm64 dynamic only. Neither iOS
                                       # distribution nor static linking is
                                       # demonstrated; SP-1 revised criterion 2
                                       # (iOS deployment-target floor) is the
                                       # real open question and is untouched.
  "6_cve_owner": met                   # Core lead, but no roll automation yet
                                       # (SP-1 budgets ~0.5 ew/quarter).
  "7_metadata": met                    # this file
  "8_dual_licence_election": partial   # FreeType FTL-vs-GPL election is
                                       # recorded above but is the
                                       # distributor's build, not ours.
  "9_size_measured": partial           # see size.note
